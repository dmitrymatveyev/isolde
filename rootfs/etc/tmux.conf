# Keep full color inside tmux, including Claude Code's selection highlighting.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB,xterm-256color:RGB"

# Let tmux tell Shift+Enter apart from Enter, so Claude Code can insert a newline.
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"

# Let Claude Code's notifications reach the outer terminal, and pass focus changes through.
set -g allow-passthrough on
set -g focus-events on
